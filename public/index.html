<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- SEO -->
    <title>Ali Portfolio</title>

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Ali Portfolio" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="Ali Portfolio" />

    <meta name="msapplication-TileColor" content="#603cba" />
    <meta name="theme-color" content="#6c63ff" />

    <!-- Icons -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="%PUBLIC_URL%/favicon-32x32.png?v8=qAJ44G5Bm7"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="%PUBLIC_URL%/favicon-16x16.png?v8=qAJ44G5Bm7"
    />
    <link
      rel="mask-icon"
      href="%PUBLIC_URL%/safari-pinned-tab.svg?v8=qAJ44G5Bm7"
      color="#885bd5"
    />
    <link rel="shortcut icon" href="%PUBLIC_URL%/favicon.ico?v8=qAJ44G5Bm7" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="%PUBLIC_URL%/apple-touch-icon.png?v8=qAJ44G5Bm7"
    />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- ✅ Preload fonts from public/fonts -->
    <link
      rel="preload"
      href="%PUBLIC_URL%/fonts/Montserrat-Regular.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />
    <link
      rel="preload"
      href="%PUBLIC_URL%/fonts/Agustina.woff"
      as="font"
      type="font/woff"
      crossorigin
    />

    <!-- ✅ Define custom fonts -->
    <style>
      @font-face {
        font-family: "Agustina";
        src: url("%PUBLIC_URL%/fonts/Agustina.woff") format("woff");
        font-display: swap;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("%PUBLIC_URL%/fonts/Montserrat-Regular.ttf") format("truetype");
        font-display: swap;
      }
      body {
        margin: 0;
        font-family: "Montserrat", sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
    </style>

    <!-- Google Analytics -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=UA-135618960-2"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "UA-135618960-2");
    </script>

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/FortAwesome/Font-Awesome@5.15.4/css/all.min.css"
    />
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
